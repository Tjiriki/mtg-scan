async function envoieLaPhoto(octets) {
    if (seance.arret) {
        affiche(ETATS.deconnecte, "refus");
        return APRES_ARRET;
    }
    if (seance.enVol) {
        // Le tour est pris : la photo n'est pas perdue, elle repartira au prochain essai de la reprise.
        affiche("Le PC est déjà en train de recevoir quelque chose.", "attente", "Attends une seconde, puis retente.");
        return APRES_REPRISE;
    }

    seance.enVol = true;
    boutonPrendre.disabled = true;
    boutonCharger.disabled = true;
    affiche("Envoi de la photo au PC…", "attente");
    try {
        const message = await sceller(seance.cle, SENS_TELEPHONE, ROUTE_PHOTO, emetsCompteur(), octets);
        const reponse = await envoie(ROUTE_PHOTO, message, null);

        if (reponse.status === 413) {
            // Le seul refus qui ne soit pas chiffré : la taille du message est jugée avant lecture. 1.3c (fiche §2,
            // lignes « Trois issues » et « Compteur ») : il se compte en « Refusées » et ne repart jamais — renvoyer
            // les mêmes octets les rendrait aussi lourds (AC-7).
            affiche(MESSAGE_IMAGE_TROP_GROSSE, "refus");
            compteur.refusees += 1;
            afficheLeCompteur();
            return APRES_CONTINUE;
        }
        if (reponse.status === 403) {
            affiche(MESSAGE_HORS_ORIGIN, "refus");
            arrete();
            return APRES_ARRET;
        }
        if (reponse.status === 401) {
            // AC-30 : la clef du QR n'est plus celle du PC. La photo n'y est pour rien.
            affiche(MESSAGE_REFUS, "refus");
            arrete();
            return APRES_ARRET;
        }
        if (!reponse.ok) {
            // 500, 503, un port qui claque : le PC n'a rien à reprocher à la photo, elle repart (1.3c, fiche §2,
            // ligne « Trois issues »).
            affiche(MESSAGE_TRANSPORT, "attente");
            return APRES_REPRISE;
        }

        const clair = await ouvreReponse(ROUTE_PHOTO, new Uint8Array(await reponse.arrayBuffer()));
        if (clair === null) {
            // Une réponse dont l'étiquette ne suit pas ne vient pas du PC : on ne la lit pas (AC-29).
            affiche(MESSAGE_REFUS, "refus");
            arrete();
            return APRES_ARRET;
        }

        const rendu = renduDeLaPhoto(clair);
        return seance.arret ? APRES_ARRET : rendu;
    } catch (photoSansReponse) {
        // Le transport a manqué — le Wi-Fi du téléphone est peut-être tombé : la photo repart, pas sautée
        // (1.3c, fiche §2, ligne « Trois issues »).
        affiche(MESSAGE_TRANSPORT, "attente");
        return APRES_REPRISE;
    } finally {
        seance.enVol = false;
        // Pendant une série, c'est la boucle qui rend les deux commandes en fin de file — pas le premier
        // tour venu. Une session close ne les rend pas : il n'y a plus rien à envoyer. 1.3b (fiche §2, ligne
        // « File d'envoi », l'exclusion) : la file de la caméra compte au même titre que la série de la
        // galerie, sinon « Charger des photos » se rouvrirait sous une photo qui monte encore.
        rendLesCommandesDeLaCamera();
    }
}

// CE QUE LE PC A RECONNU (fiche §2, ligne « Réponse au téléphone »). Les mots-clefs du protocole
// (« exacte », « a_choisir », « non_reconnue » — PagesScan.NiveauSurLeFil) ne se montrent jamais : ici, des
// phrases en français. Un niveau que cette page ne connaît pas se dit, il ne se peint pas en vert.
//
// AC-15 (avenant AV1 §3), puis 1.3c (fiche §2, ligne « Refus passagers »), ce que la fonction REND à l'envoi :
// APRES_REPRISE pour les quatre motifs que MOTIFS_PASSAGERS nomme — le PC est occupé, la photo ne l'est pas —,
// et ils rendent leur phrase sans « retente ». Une carte non reconnue, un format refusé, une image trop grande
// pour le PC, un motif que la page ne connaît pas : APRES_CONTINUE, la photo d'après mérite sa chance.
function renduDeLaPhoto(clair) {
    let recu;
    try {
        recu = JSON.parse(clair);
    } catch (jsonRejete) {
        recu = null;
    }

    if (recu === null || typeof recu !== "object") {
        // Une réponse qui n'est pas du JSON n'est pas un accusé du PC : la page ne sait rien de la photo, et le
        // compteur le dit en « Refusées » (1.3c, fiche §2, ligne « Compteur »). Elle ne repart pas — un second envoi
        // se heurterait à la même réponse.
        affiche(MESSAGE_REFUS, "refus");
        compteur.refusees += 1;
        afficheLeCompteur();
        return APRES_CONTINUE;
    }

    // SCAN-FIX P3 : le PC met la photo à l'abri et répond tout de suite ; la reconnaissance se fait ensuite, et
    // son résultat arrive par le battement d'état (suiviDesPhotos). « recu » est l'empreinte de la photo : elle
    // ne se montre pas. La photo suivante peut partir sans attendre.
    if (typeof recu.recu === "string") {
        const attente = typeof recu.enAttente === "number" ? recu.enAttente : 0;
        affiche("Photo reçue par le PC.", "connecte",
            attente > 1 ? attente + " photos en attente de reconnaissance — tu peux continuer."
                        : "Reconnaissance en cours — tu peux prendre la suivante.");
        // 1.3c (fiche §2, ligne « Compteur ») : « Reçues » monte à cet accusé du PC. Le résultat de la
        // reconnaissance, qui arrive par le battement d'état, ne compte pas une seconde fois.
        compteur.recues += 1;
        afficheLeCompteur();
        return APRES_CONTINUE;
    }

    // La phrase du refus se rend dans les deux cas : le doigt lit pourquoi, que la photo reparte ou non. 1.3c
    // (fiche §2, ligne « Refus passagers ») : sur « minute », elle rend de plus le compte des photos en attente du
    // compteur — la photo en cours est déjà dedans, elle est prise et non reçue. La soustraction est relue ici
    // plutôt que prêtée à afficheLeCompteur(), qui écrit la ligne du compteur sans en rendre de chiffre. Le motif
    // qui n'est pas passager (« format », « dimensions », un motif inconnu) est un refus définitif : compté en
    // « Refusées », il rend sa phrase au doigt et la ligne du compteur se relit avec, hors d'attente.
    if (typeof recu.refus === "string") {
        const connue = Object.prototype.hasOwnProperty.call(MOTIFS_DE_REFUS, recu.refus);
        const enAttente = compteur.prises - compteur.recues - compteur.refusees;
        affiche(recu.refus === "minute" ? MESSAGE_CAMERA_MINUTE + enAttente
            : connue ? MOTIFS_DE_REFUS[recu.refus] : MESSAGE_REFUS_INCONNU, "refus");
        if (MOTIFS_PASSAGERS.includes(recu.refus))
            return APRES_REPRISE;
        compteur.refusees += 1;
        afficheLeCompteur();
        return APRES_CONTINUE;
    }

    // Les niveaux que le PC rend (fiche §2, ligne « Réponse au téléphone ») : la photo est reçue à chacun, reconnue
    // ou non. 1.3c (fiche §2, ligne « Compteur ») compte donc chaque réponse de niveau en « Reçues », la phrase du
    // doigt rendue d'abord et la ligne du compteur relue avec.
    const nom = typeof recu.nom === "string" ? recu.nom : "";
    if (recu.niveau === "exacte") {
        // « Reconnue : <nom> (<CODE> #<n°>) », le gabarit de la fiche, et le code d'extension seul — AC-2 ne
        // rend pas le nom de l'extension à l'écran du téléphone. Sans impression retenue, ni code ni numéro :
        // la phrase garde le nom seul, sans parenthèses.
        const code = typeof recu.extension === "string"
            ? " (" + recu.extension + (typeof recu.numero === "string" ? " #" + recu.numero : "") + ")"
            : "";
        affiche(MESSAGE_RECONNUE + nom + code, "connecte");
        compteur.recues += 1;
        afficheLeCompteur();
        return APRES_CONTINUE;
    }

    if (recu.niveau === "a_choisir") {
        // La fiche écrit « À choisir sur le PC : <n> versions possibles ». Ce <n> n'arrive pas jusqu'ici :
        // la réponse ne porte que nom, code et nom d'extension, numéro et niveau, « ni les candidates »
        // (PagesScan.ReponsePhotoJson). Faute du chiffre, la phrase n'est pas celle de la fiche — l'écart est
        // dit au rapport du lot, pas comblé par un champ ajouté au protocole d'AC-2 sans personne.
        affiche(MESSAGE_A_CHOISIR, "attente",
            (nom === "" ? "" : nom + " — ") + "choisis l'impression sur l'écran du PC.");
        compteur.recues += 1;
        afficheLeCompteur();
        return APRES_CONTINUE;
    }

    if (recu.niveau === "non_reconnue") {
        affiche(MESSAGE_NON_RECONNUE, "refus");
        compteur.recues += 1;
        afficheLeCompteur();
        return APRES_CONTINUE;
    }

    // Un niveau que cette page ne connaît pas n'est pas un refus du PC : la photo est bien chez lui.
    affiche("Le PC a répondu un niveau que cette page ne connaît pas.", "refus");
    compteur.recues += 1;
    afficheLeCompteur();
    return APRES_CONTINUE;
}

// L'armement de la prise de vue, appelé une fois la session ouverte : avant l'appairage il n'y a aucune clef,
// donc rien à chiffrer — la fiche §2 ne propose la photo qu'après le QR. Les DEUX commandes s'arment ensemble
// (AC-1 de l'avenant, tenu par 1.3b) : chacune ouvre ce qui la regarde, et rien ici n'attend une caméra qui
// pourrait ne jamais répondre — l'armement n'ouvre rien du tout, c'est l'appui du doigt qui ouvre, et son refus
// se lit en clair. Un refus d'état (clef périmée, origine hors liste) n'arme rien : la session est close,
// l'écran dit déjà pourquoi.
function ouvreLaPrise() {
    sectionPrise.hidden = false;

    // 1.3b (fiche §2, ligne « Repli ») : le refus qui avait rendu l'appareil natif appartenait à la session
    // d'avant ; une session neuve redemande l'objectif dans la page.
    camera.refus = "";

    // AC-1, depuis 1.3b : « Prendre une photo » ouvre l'objectif dans la page, aperçu compris et micro jamais
    // demandé. L'appareil photo arrière du téléphone reste armé derrière, comme repli d'après un refus.
    boutonPrendre.addEventListener("click", surPrendre);

    // 1.3b (fiche §2, ligne « Un appui, une photo ») : la commande que l'aperçu rend accessible — un appui, une
    // photo, et l'objectif reste ouvert pour la carte d'après.
    boutonDeclencher.addEventListener("click", auDeclencheur);

    // AC-15 : « Charger des photos » ouvre la galerie, plusieurs photos à la fois.
    boutonCharger.addEventListener("click", ouvreLaGalerie);

    // Le téléphone a rendu une prise validée. Une prise annulée ne rend aucun événement change : ce geste n'a
    // donc rien à envoyer (AC-1).
    champAppareil.addEventListener("change", function () {
        const fichiers = enAttente(champAppareil);
        videLeChamp(champAppareil);
        if (fichiers.length === 0)
            return;

        // 1.3c (fiche §2, ligne « Appareil natif ») : la prise se range dans la file de la caméra, qui la garde
        // jusqu'à son envoi, la réencode et la reprend seule si l'envoi échoue — plus rien à rattraper ici, et la
        // prise illisible se dit dans la file (leTelephoneNaPasLu).
        unePhotoDuTelephone(fichiers[0]);
    });

    // La galerie a rendu n fichiers : ils partent une par une, chacun après la réponse du précédent (AC-15).
    champGalerie.addEventListener("change", function () {
        const fichiers = enAttente(champGalerie);
        videLeChamp(champGalerie);
        chargeLaGalerie(fichiers).catch(function (serieSansReponse) {
            affiche(MESSAGE_TRANSPORT, "attente");
        });
    });
}


// L'ouverture de la page : le fragment, la clef, l'appairage, puis le battement.
async function demarre() {
    const parametresDeSonde = estLaSonde();
    if (parametresDeSonde !== null) {
        await sondeAc33(parametresDeSonde);
        return;
    }

    const fragment = litFragment();
    if (fragment.erreur === "absent") {
        affiche(MESSAGE_SANS_FRAGMENT, "refus");
        return;
    }
    if (fragment.erreur === "format") {
        affiche(MESSAGE_FORMAT, "refus");
        return;
    }
    if (fragment.erreur === "clef") {
        affiche(MESSAGE_CLE, "refus");
        return;
    }

    effaceLeFragment();

    let clef;
    try {
        clef = await importeCle(fragment.octetsDeClef);
    } catch (importRefuse) {
        affiche(MESSAGE_CLE, "refus");
        return;
    }

    // Une adresse IPv6 s'écrit entre crochets dans une URL, une IPv4 sans rien d'autre.
    const hote = fragment.adresse.indexOf(":") >= 0 ? "[" + fragment.adresse + "]" : fragment.adresse;
    seance.cle = clef;
    seance.url = "http://" + hote + ":" + fragment.port;
    seance.identifiant = tireIdentifiantTelephone();

    window.addEventListener("pagehide", surDepart);     // AC-34 : /fin tente de partir à la fermeture ; 1.3b rend l'objectif avec elle
    document.addEventListener("visibilitychange", surVisibilite);   // 1.3b, DIR-SCAN-25 a : la page cachée rend l'objectif

    affiche("Connexion au PC…", "attente");
    await battement();
    if (!seance.arret)
        seance.minuteur = setInterval(battement, INTERVALLE_BATTEMENT);

    // SCAN-3 (AC-1) : la prise de vue ne s'arme qu'une fois la session ouverte — avant l'appairage il n'y a
    // aucune clef, donc rien à chiffrer, et la fiche §2 ne propose la photo qu'après le QR. Un refus d'état
    // (clef périmée, origine hors liste) ne l'arme pas : la session est close, l'écran dit déjà pourquoi.
    if (!seance.arret && seance.aparie)
        ouvreLaPrise();
}

demarre().catch(function (imprevu) {
    affiche("La page n'a pas pu démarrer.", "refus", imprevu && imprevu.name ? imprevu.name : String(imprevu));
});
</script>
