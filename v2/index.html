<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- SCAN-3, fiche §2 « Prise de vue » et AC-1 / AC-11, repris par l'avenant AV1 §3 (decision de Thomas du
     2026-10-16 16:18:23) : la page v2, publiée sous https://tjiriki.github.io/mtg-scan/v2/
     (OriginesScan.UrlPage), est la page v1 avec la prise de vue en plus — « mêmes règles que la v1 : mêmes
     phrases, mêmes chemins, mêmes garde-fous ». Ce qui change est écrit au bloc « PRISE DE VUE » plus bas dans
     le script : les DEUX commandes du téléphone — « Prendre une photo » et « Charger des photos » (la galerie,
     plusieurs à la fois) — le réencodage JPEG de chaque image d'origine et la route chiffrée /photo.
     1.3b (docs/ARCHITECTE_FICHE_DEV_1.3b_CameraDansLaPage.md) rend la caméra à la page : « Prendre une photo »
     ouvre l'objectif dans la page sur l'appui du doigt, jamais au chargement, chaque appui sur « Photo » rend
     une prise et la caméra reste ouverte. Le sélecteur de l'avenant AV1 n'est pas jeté pour autant : il tient
     le repli quand la caméra de la page est refusée (fiche §2, ligne « Repli »). Ce qui ne change pas d'un
     octet : la photo n'a jamais pour origine ce que l'aperçu affiche — elle vient de l'objectif, réencodée
     avant de partir — et la v1 reste publiée telle quelle sous /v1/, sans aucune de ces lignes.
     FICHIER UNIQUE : HTML, CSS et script ensemble,
     AUCUNE ressource externe (DIR-SCAN-18) — pas de CDN, pas de police téléchargée, pas d'image. La politique
     de contenu est portée par cette balise <meta> parce que la page est servie par un hébergeur statique sur
     lequel l'application n'écrit aucun en-tête.
     Ce que la politique ferme, et pourquoi elle est écrit ainsi :
       default-src 'none'     : rien, par défaut.
       script-src/style-src   : 'unsafe-inline' est contraint — la page est un fichier unique, son script ne
                                peut donc pas venir d'un fichier externe ni d'un nonce que l'hébergeur ne pose pas.
       connect-src http:      : SEULE destination possible, le PC local. Les requêtes sortantes en https: sont
                                refusées, donc la clef du fragment ne peut pas être envoyée sur le réseau par
                                une requête détournée ; l'adresse du PC arrive par le fragment et ne peut pas
                                être écrite à l'avance, d'où le schéma seul.
       img/font/object/media  : 'none' — la page n'affiche rien d'autre que du texte.
       frame-ancestors/base-uri/form-action : 'none' — la page n'embarque, ne se charge et ne transmet rien.
     Le referrer est coupé pareillement par une balise : la clef ne doit se retrouver dans aucun Referer. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http:; img-src 'none'; font-src 'none'; object-src 'none'; media-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>MTG Manager — Scanne la carte</title>
<style>
:root { color-scheme: light dark; }
html { -webkit-text-size-adjust: 100%; }
/* SCAN-3, décision de Thomas du 2026-10-16 14:43:41 (docs/THOMAS_DECISION_SCAN-3_PageTelephone.md §2), tenue à
   l'avenant AV1 (docs/ARCHITECTE_AVENANT_SCAN-3-AV1_PageDeuxBoutons.md §2 et AC-1) : « le bouton “Prendre la
   photo” est sous le bas de l'écran du téléphone : il faut faire défiler la page pour l'atteindre ». Tenu en
   portrait, l'écran de prise de vue tient donc entier, les deux commandes comprises. Ce que l'avenant change à
   la tenue de la page : la pièce élastique qui se réduisait pour garder le bouton à l'écran — l'aperçu de la
   caméra — avait été retirée à l'avenant, puis rendue par 1.3b sous une forme bornée (une hauteur maximale,
   jamais élastique) qui ne commande plus rien. Le corps reprend sa
   hauteur par défaut et le paragraphe de détail sa place : la décision du 2026-10-16 14:43:41 §2 rendait le
   bouton atteignable, l'écart n° 24 du rapport §7.4 lui reprochait de COUPER une réponse longue au lieu de la
   laisser défiler. Les deux sont réconciliés ici : la page est pleine hauteur, rien ne la borde, et les deux
   commandes — les deux premières pièces après le titre, chacune de la hauteur d'un pouce — se voient avant
   qu'aucun texte long n'ait été écrit. Ce que la page ne prouve pas : la hauteur que Brave laisse vraiment sous
   sa barre d'outillage sur le téléphone de Thomas — c'est AC-1, et AC-1 est au R-RUN. */
body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    padding: 10px 14px 12px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.3;
    background: #14161a;
    color: #f2f3f5;
}
main {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    max-width: 32em;
    margin: 0 auto;
}
.marque {
    margin: 0 0 6px;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9aa3b2;
}
/* L'état tient sur une ligne courte : c'est ce que Thomas lit sur l'écran du téléphone posé (AC-34). */
.etat {
    margin: 0;
    font-size: 21px;
    font-weight: 600;
    overflow-wrap: anywhere;
}
.detail {
    margin: 6px 0 0;
    font-size: 15px;
    color: #b9c0cc;
    overflow-wrap: anywhere;
}
/* Le vert et le rouge ne portent pas l'information seuls : le mot français l'a déjà dite (AC-34). */
.connecte { color: #57d38c; }
.refus { color: #ff8f8f; }
.attente { color: #f0c674; }
/* SCAN-3, AC-1 et avenant AV1 §2 / §3 : la prise de vue est une pile de commandes ; depuis 1.3b l'aperçu de
   l'objectif la surmonte quand la caméra vit (fiche §2, ligne « Ouverture »). La section n'est élastique que
   pour pousser le bloc hors du bas de page si le téléphone en rend une plus petite ; rien, dedans, ne se
   réduit au point de disparaître. Les deux commandes sont de vrais boutons,
   atteignables au doigt comme au pouce, et restent dans l'ordre du clavier. */
.prise {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    margin: 12px 0 0;
}
.prise[hidden] { display: none; }
/* Le titre que la fiche impose à AC-11 (« Scanne la carte ») est un h1 de la classe .etat : il était écrit au
   corps 25 px comme la ligne d'état, soit 36 px comptés dans le défilement du téléphone. Il garde son texte,
   sa place et sa fonction de titre ; il prend le corps du texte courant. */
#prise h1 { font-size: 17px; }
.bouton {
    display: block;
    flex: 0 0 auto;
    width: 100%;
    margin: 10px 0 0;
    padding: 14px 18px;
    font: inherit;
    font-size: 19px;
    font-weight: 600;
    color: #10131a;
    background: #e7eaf0;
    border: 0;
    border-radius: 10px;
}
.bouton[disabled] { opacity: 0.55; }
/* 1.3b, fiche §2 ligne « Ouverture » : l'aperçu de l'objectif ne se montre que pendant que la caméra vit,
   et borne sa hauteur pour que les deux commandes restent atteignables au doigt sans faire défiler. Ce
   qu'il affiche n'est jamais ce qui part au PC : la photo vient de l'objectif, pas de ce qui est dessiné
   ici (fiche §2, ligne « Taille »). « muet » et « playsinline » sont portés par la balise : sans le second,
   Chrome et Brave lisent le flux en plein écran et la commande de prise sort de l'écran. */
.apercu {
    display: block;
    flex: 0 0 auto;
    width: 100%;
    max-height: 42vh;
    margin: 10px 0 0;
    object-fit: contain;
    background: #000;
    border-radius: 10px;
}
.apercu[hidden] { display: none; }
/* Un vrai bouton caché par l'attribut « hidden » ne se montre plus que si la page le veut : la règle de
   display ci-dessus gagnerait sinon sur celle du navigateur. #prendre et #declencher s'échangent ainsi. */
.bouton[hidden] { display: none; }
/* 1.3b, fiche §2 ligne « Un appui, une photo » : la ligne de mesure de chaque prise, lue entre l'aperçu et
   les commandes. Vide, elle ne prend aucune place ; remplie, elle se lit sans défiler. */
#mesure {
    margin: 6px 0 0;
    font-size: 15px;
    color: #b9c0cc;
    overflow-wrap: anywhere;
}
#mesure:empty { display: none; }
/* 1.3c, fiche §2 ligne « Compteur » : la ligne des trois chiffres, sous la mesure de chaque prise. Elle se lit sans
   défiler, comme elle. Vide, elle ne se montre pas : ce n'est pas son texte qui la dit mais l'attribut « hidden »,
   posé à l'écriture par afficheLeCompteur(), seul écrivain de cette ligne. */
#compteur {
    margin: 4px 0 0;
    font-size: 15px;
    color: #b9c0cc;
    overflow-wrap: anywhere;
}
#compteur[hidden] { display: none; }
/* Les deux champs de sélection ne se voient pas : ce sont les deux boutons ci-dessus qui les ouvrent, l'un sur
   l'appareil photo arrière du téléphone (l'attribut capture est posé sur le champ), l'autre sur la galerie
   avec plusieurs images à la fois (l'attribut multiple, et aucun capture). Un champ fichier caché par le style
   reste atteignable au script : c'est le geste du doigt sur le bouton qui lui ouvre la porte du téléphone, et
   c'est ce geste-là que le navigateur accepte. */
.champ {
    display: none;
}
</style>
</head>
<body>
<main>
    <p class="marque">MTG Manager</p>
    <p id="etat" class="etat" role="status" aria-live="polite">Ouverture…</p>
    <p id="detail" class="detail" role="status" aria-live="polite"></p>
    <!-- SCAN-3, AC-1 et AC-11, repris par l'avenant AV1 §2 : la prise de vue n'apparaît qu'une fois la session
         ouverte — avant l'appairage il n'y a aucune clef, donc rien à chiffrer. « Scanne la carte » est le titre
         que la fiche impose à AC-11 ; au-dessus, l'état et le détail gardent mot pour mot les phrases de la v1.
         Les DEUX commandes sont vues dès que cette section paraît, sans rien faire défiler (AC-1). 1.3b (fiche
         §2) rend un aperçu à cette prise de vue : il ne se montre que pendant que l'objectif est ouvert, et
         borne sa hauteur pour que les commandes restent au doigt. -->
    <section id="prise" class="prise" hidden>
        <h1 class="etat">Scanne la carte</h1>
        <canvas id="toile" width="0" height="0" hidden></canvas>
        <!-- 1.3b, fiche §2 ligne « Ouverture » : l'aperçu de l'objectif, la ligne de mesure et la commande de
             prise. Les trois sont cachées à l'armement de la section et ne paraissent qu'une fois l'objectif
             ouvert. L'aperçu est muet et « playsinline » — sans cet attribut, Chrome et Brave lisent le flux en
             plein écran — et n'a aucun attribut src : le flux lui arrive par la source d'objet posée par le
             script, ce que relit le test de la page, donc la politique « media-src 'none' » n'a rien à charger. -->
        <video id="apercu" class="apercu" muted playsinline hidden></video>
        <!-- 1.3b, fiche §2 ligne « Un appui, une photo » : « Photo n : largeur × hauteur px, t ms », le temps
             compté de l'appui à la photo rendue, attente derrière la prise précédente comprise. -->
        <p id="mesure"></p>
        <!-- 1.3c, fiche §2 ligne « Compteur » (D-7) : « Prises : P · Reçues : R · En attente : A », suivi de
             « · Refusées : X » quand X dépasse zéro. Caché tant qu'aucune photo n'a été prise — avant, il n'y a rien
             à compter —, écrit par afficheLeCompteur() seul. -->
        <p id="compteur" hidden></p>
        <!-- AC-1, premier chemin : « Prendre une photo » ouvre la caméra dans la page depuis 1.3b ; après un
             refus, le même appui ouvre l'appareil photo arrière du téléphone (fiche §2, ligne « Repli »). -->
        <button id="prendre" class="bouton" type="button">Prendre une photo</button>
        <!-- 1.3b : la commande que l'aperçu rend accessible sous la caméra vivante — un appui, une photo, sans
             écran de validation et sans que l'objectif se referme. -->
        <button id="declencher" class="bouton" type="button" hidden>Photo</button>
        <!-- AC-15, second chemin : « Charger des photos » (ouvre la galerie, plusieurs photos à la fois). -->
        <button id="charger" class="bouton" type="button">Charger des photos</button>
        <!-- Les deux champs que les boutons ouvrent, et personne d'autre : #appareil porte capture="environment"
             — c'est ce qui demande l'objectif du dos en pleine résolution —, #galerie porte multiple et aucun
             capture, ce qui laisse le téléphone montrer sa galerie. La toile cache le canvas : elle ne sert
             qu'au réencodage de l'image, jamais elle ne se montre (AC-16). -->
        <input id="appareil" class="champ" type="file" accept="image/*" capture="environment">
        <input id="galerie" class="champ" type="file" accept="image/*" multiple>
    </section>
    <noscript class="detail">Cette page a besoin de JavaScript pour chiffrer ses échanges avec le PC.</noscript>
</main>
<script>
"use strict";

// SCAN-2, avenant SCAN-2-AV3 (AC-29 à AC-34) — ce que la page sait du protocole. Les constantes ci-dessous
// reproduisent les valeurs du PC (src/MTGManager.App/Scan/Serveur/ChiffrementScan.cs, SessionChiffree.cs,
// ServeurScanLocal.cs, OriginesScan.cs) : elles se réécrivent ENSEMBLE, sinon l'étiquette d'authentification
// ne passe plus et rien ne s'apparie — c'est le sens d'AC-33.
//
// Ce que cette page ne fait pas : elle n'affiche et n'écrit nulle part la clef du fragment (AC-28,
// DIR-SCAN-21 : ni console, ni titre, ni stockage) ; elle n'appelle personne d'autre que le PC (la CSP
// « connect-src http: » le refuse, DIR-SCAN-18) ; elle ne conserve rien après sa fermeture — clef et
// identifiant vivent en mémoire de script, dans aucun stockage du navigateur ; elle ne relit jamais le
// fragment effacé, un code ne sert qu'une fois (AC-30).

const PROTOCOLE = "MTGSCAN1";                // ChiffrementScan.VersionDeProtocole
const SENS_TELEPHONE = 1;                    // ChiffrementScan.SensTelephoneVersPc
const SENS_PC = 2;                           // ChiffrementScan.SensPcVersTelephone
const ROUTE_APPAIRAGE = "/apparier";         // la route qui lie la page à la clef, seule à porter l'identifiant
const ROUTE_ETAT = "/etat";                  // le battement de cinq secondes, dont la réponse est chiffrée
const ROUTE_FIN = "/fin";                    // la page se ferme, l'écran du PC passe à « Téléphone déconnecté »
const ROUTE_PHOTO = "/photo";                // ServeurScanLocal.RoutePhoto (SCAN-3, AC-2) : la quatrième route
                                             // chiffrée, la seule dont le clair ne soit pas un mot d'état mais
                                             // les octets d'une image
const EN_TETE_IDENTIFIANT = "X-MTG-Pair";    // SessionChiffree.NomEnTeteTelephone
const TYPE_DE_CORPS_CHIFFRE = "application/octet-stream";        // le type des deux routes qui attendent une réponse
const TYPE_DE_CORPS_SANS_PRELIMINAIRE = "text/plain";            // AC-40 : seul type de corps qu'un navigateur
                                                                 // envoie sans préliminaire CORS — /fin y a droit
                                                                 // parce qu'il part pendant la fermeture de l'onglet
const TAILLE_CLE = 32;                       // ChiffrementScan.TailleDeCle : 256 bits, DIR-SCAN-4 v2
const TAILLE_IDENTIFIANT = 16;               // SessionChiffree.TailleDIdentifiantTelephone
const TAILLE_ETIQUETTE = 16;                 // ChiffrementScan.TailleDEtiquette : 128 bits, DIR-SCAN-16
const TAILLE_NONCE = 12;                     // ChiffrementScan.TailleDeNonce : 96 bits, jamais tiré au hasard
const TAILLE_COMPTEUR = 8;                   // ChiffrementScan.TailleDeCompteur, en tête de chaque message
const INTERVALLE_BATTEMENT = 5000;           // SessionChiffree.IntervalleDeBattement : quinze secondes sans
                                             // battement affichent « Téléphone inactif » sur le PC (AC-36)

// AC-34 : les deux phrases imposées, mot pour mot, accents compris.
const MESSAGE_CONNECTE = "Téléphone connecté à MTG Manager.";
const MESSAGE_REFUS = "Ce code a déjà servi ou a expiré. Sur le PC, touchez « Nouveau code d'appairage », puis scannez le nouveau code.";

// Ce que le PC rend dans la réponse chiffrée (PagesScan.EtatChiffreJson : « etat » vaut attente | connecte |
// inactif | deconnecte, AC-34 et AC-36), traduit en français ici — le mot-clef ASCII n'est jamais montré.
const ETATS = {
    attente: "Le PC attend un code plus récent. Scanne celui qui vient d'être affiché.",
    connecte: MESSAGE_CONNECTE,
    inactif: "Téléphone inactif aux yeux du PC. Garde cette page ouverte.",
    deconnecte: "Déconnecté du PC. Ouvre l'écran Scanner, puis scanne le code qu'il affiche.",
    inconnu: "Le PC a répondu un état que cette page ne connaît pas."
};

// Les phrases que l'avenant n'impose pas mais qu'un téléphone mérite : elles disent quoi faire, jamais la
// clef ni le moindre détail du message (AC-28, et le refus du PC qui ne se raconte pas, DIR-SCAN-9).
const MESSAGE_SANS_FRAGMENT = "Ce lien n'est pas un code de connexion. Ouvre l'écran Scanner du PC et scanne le code qu'il affiche.";
const MESSAGE_FORMAT = "Ce code n'est pas au format de cette page. Scanne le code affiché par le PC.";
const MESSAGE_CLE = "Ce code ne porte pas de clef valide. Scanne le code affiché par le PC.";
const MESSAGE_HORS_ORIGIN = "Cette page n'est pas servie depuis l'origine que le PC attend. Ouvre-la depuis l'adresse du PC.";
const MESSAGE_TRANSPORT = "Le PC ne répond pas. Vérifie qu'il est allumé, que l'écran Scanner est ouvert, et que le téléphone est sur le même réseau.";

// SCAN-3, AC-1 (fiche §2, ligne « Réponse au téléphone ») : les trois phrases que le téléphone rend, mot
// pour mot. La fiche écrit « À choisir sur le PC : <n> versions possibles » — mais le clair de la réponse ne
// porte que « nom, code et nom d'extension, numéro de collection, niveau » (PagesScan.ReponsePhotoJson) :
// aucun nombre de versions n'arrive jusqu'ici. La phrase est donc rendue sans le chiffre, et l'écart est dit
// au rapport du lot plutôt que d'être comblé par un champ ajouté au protocole d'AC-2 sans personne.
const MESSAGE_RECONNUE = "Reconnue : ";        // + « <nom> (<CODE> #<n°>) », bâti par renduDeLaPhoto
const MESSAGE_A_CHOISIR = "À choisir sur le PC";
const MESSAGE_NON_RECONNUE = "Carte non reconnue — réessayez avec plus de lumière";

// AVENANT AV1 (AC-1 et AC-15) : les phrases que les DEUX commandes doivent rendre. L'avenant ne les impose pas
// mot pour mot — seule la ligne « Scanne la carte » de la fiche est citée — mais elles disent quoi faire,
// jamais un détail technique. 1.3c (fiche §2, ligne « Deux files ») : la phrase du compte « après la minute » a
// disparu, une série ne s'interrompt plus pour un refus passager du PC — elle reprend seule. Celle qui reste
// porte un nombre en fin de ligne : AC-15 veut que la page « dise combien de photos restent à renvoyer » quand
// la session ferme en cours de route.
const MESSAGE_SERIE_EN_COURS = "Une série de photos est déjà en cours d'envoi.";
const MESSAGE_SERIE_COUPEE = "Photos restantes à renvoyer après un nouvel appairage : ";
// Le téléphone n'a pas rendu une image que sa propre appli sait lire : la photo n'est jamais partie, et ce
// n'est pas un refus du PC. La série passe à la suivante.
const MESSAGE_ENCODE_IMPOSSIBLE = "Le téléphone n'a pas pu lire cette image.";
// 1.3b (fiche §2, lignes « Ouverture » et « Repli ») : les deux phrases que la caméra de la page rend au doigt,
// quand l'objectif est ouvert et quand il a été refusé. Elles n'en remplacent aucune : les sept phrases de la
// v1 ci-dessus restent mot pour mot (AC-11). Celle du refus dit quoi toucher ensuite, et le nom de l'erreur se
// lit sur la ligne de détail — « un message en clair (nom de l'erreur compris) », fiche §2, ligne « Repli ».
const MESSAGE_CAMERA_OUVERTE = "Caméra ouverte. Touche « Photo » pour chaque carte : l'objectif reste ouvert.";
const MESSAGE_CAMERA_REFUSEE = "La caméra de cette page n'a pas répondu. Touche encore « Prendre une photo » : l'appareil photo du téléphone prendra la carte.";
// 1.3c (fiche §2, lignes « Deux files » et « Compteur ») : la branche « minute » de la file de la caméra a
// disparu, la reprise des envois la remplace — cinq secondes entre deux essais, sans limite. Cette phrase est lue
// depuis P2 sur le refus « minute » du PC, rendue au doigt avec le compte des photos en attente du compteur. Elle
// n'en remplace aucune.
const MESSAGE_CAMERA_MINUTE = "Le PC a reçu soixante photos dans la minute. Elles partiront seules, photos en attente : ";

// Les refus que le PC sait dire (TraitementPhoto.Motif*, rendus par PagesScan.RefusPhotoEnJson) : la fiche
// §2, point 6, veut « une réponse chiffrée qui dit pourquoi, sans détail technique ». Ces phrases ne sont pas
// de la fiche — elle n'en impose que trois ci-dessus — mais elles disent quoi faire, jamais un nom de
// méthode, un code HTTP ni un motif ASCII. 1.3c (fiche §2, ligne « Refus passagers ») : les quatre motifs qui
// repartent seuls ne disent plus « retente » — le doigt n'a rien à reprendre.
const MOTIFS_DE_REFUS = {
    format: "Cette image n'est pas lisible. Prends la carte en photo, ou choisis un JPEG ou un PNG.",
    dimensions: "Cette image est trop grande pour le PC. Reprends la carte en photo.",
    occupe: "Le PC traite déjà une photo. La tienne part juste après elle, toute seule.",
    minute: "Trop de photos d'affilée. La tienne repartira seule dans un instant.",
    erreur: "Le PC n'a pas pu lire la carte. Elle repartira seule, sans rien toucher.",
    indisponible: "La reconnaissance n'est pas ouverte sur ce PC. Ouvre l'écran Scanner : la photo repartira seule."
};
const MESSAGE_REFUS_INCONNU = "Le PC a refusé la photo sans dire pourquoi.";
// 1.3c (fiche §2, ligne « Refus passagers ») : les motifs que le PC donne parce qu'il est occupé, et non parce
// que la photo est mauvaise — la même photo repart seule, cinq secondes plus tard, avec les mêmes octets. Les
// motifs « format » et « dimensions » ne sont pas ici : les corriger est au doigt, pas à la page.
const MOTIFS_PASSAGERS = ["minute", "occupe", "erreur", "indisponible"];

// Le seul refus que la page reçoit sans qu'il soit chiffré : la taille du message est jugée avant toute
// lecture (ServeurScanLocal.LireMessage), sous le plafond de quinze mégaoctets commun aux quatre routes.
const MESSAGE_IMAGE_TROP_GROSSE = "Cette photo est trop lourde pour le PC. Reprends la carte en photo.";

const cryptage = new TextEncoder();
// ————— base64url sans remplissage (ChiffrementScan.EncoderBase64Url, OriginesScan.UrlDuQr) —————

function base64UrlEnOctets(valeur) {
    if (typeof valeur !== "string" || valeur === "")
        return null;

    const normalisee = valeur.replace(/-/g, "+").replace(/_/g, "/");
    const bourrelet = "=".repeat((4 - (normalisee.length % 4)) % 4);
    let decode;
    try {
        decode = atob(normalisee + bourrelet);
    } catch (horsAlphabet) {
        // atob lève sur tout caractère hors alphabet : la clef est alors absente, jamais déformée.
        return null;
    }

    const octets = new Uint8Array(decode.length);
    for (let i = 0; i < decode.length; i++)
        octets[i] = decode.charCodeAt(i);
    return octets;
}

function octetsEnBase64Url(octets) {
    let texte = "";
    for (let i = 0; i < octets.length; i++)
        texte += String.fromCharCode(octets[i]);
    return btoa(texte).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function octetsEnHexadecimal(octets) {
    let texte = "";
    for (let i = 0; i < octets.length; i++)
        texte += octets[i].toString(16).padStart(2, "0");
    return texte;
}

// ————— les trois pièces du message (avenant §2 « Nonce », « Données associées », « Corps d'un message ») —————

// Le nonce : octet 0 = le sens, octets 1 à 3 = zéro, octets 4 à 11 = le compteur non signé 64 bits
// gros-boutiste. Aucun tirage au hasard ici — deux messages portant le même compteur porteraient le même
// nonce, et c'est le compteur strictement croissant tenu par la page qui rend le second impossible (AC-30).
function nonce(sens, compteur) {
    const valeur = new Uint8Array(TAILLE_NONCE);
    valeur[0] = sens;
    new DataView(valeur.buffer).setBigUint64(4, compteur, false);
    return valeur;
}

// MTGSCAN1|<sens>|<route>|<compteur> en UTF-8, exactement : un message scellé pour /etat ne se relit donc
// pas sur /apparier (AC-29, DIR-SCAN-16).
function donneesAssociees(sens, route, compteur) {
    return cryptage.encode(PROTOCOLE + "|" + sens + "|" + route + "|" + compteur.toString());
}

// L'enveloppe [compteur 8][chiffré][étiquette 16] : WebCrypto rend le chiffré suivi de l'étiquette, dans
// l'ordre où le PC les attend — c'est cette suite d'octets que la sonde AC-33 compare avec .NET.
async function sceller(cle, sens, route, compteur, clair) {
    // SCAN-3 (AC-2) : le clair n'est plus toujours du texte. Sur /photo c'est une image, donc un
    // Uint8Array qui traverse tel quel — le PC déchiffre des octets, pas une phrase. Tout le reste (les
    // trois messages d'appairage) reste du texte encodé en UTF-8, comme sous la v1.
    const donnees = clair instanceof Uint8Array ? clair : cryptage.encode(clair);
    const scelle = await crypto.subtle.encrypt(
        {
            name: "AES-GCM",
            iv: nonce(sens, compteur),
            additionalData: donneesAssociees(sens, route, compteur),
            tagLength: 8 * TAILLE_ETIQUETTE
        },
        cle,
        donnees);

    const corps = new Uint8Array(scelle);
    const message = new Uint8Array(TAILLE_COMPTEUR + corps.length);
    new DataView(message.buffer).setBigUint64(0, compteur, false);
    message.set(corps, TAILLE_COMPTEUR);
    return message;
}

// Le compteur relu en tête d'une réponse, avant toute autre lecture de son contenu (DIR-SCAN-17).
function lisCompteur(message) {
    return new DataView(message.buffer, message.byteOffset, message.byteLength).getBigUint64(0, false);
}

// La réponse du PC ouverte : null quand l'enveloppe est trop courte ou que l'étiquette ne suit pas — la
// page ne lit alors aucun fragment de clair, comme le PC pour la requête qu'il reçoit (AC-29).
async function ouvrir(cle, sens, route, compteur, message) {
    if (message.length < TAILLE_COMPTEUR + TAILLE_ETIQUETTE)
        return null;

    const clair = await crypto.subtle.decrypt(
        {
            name: "AES-GCM",
            iv: nonce(sens, compteur),
            additionalData: donneesAssociees(sens, route, compteur),
            tagLength: 8 * TAILLE_ETIQUETTE
        },
        cle,
        message.subarray(TAILLE_COMPTEUR));

    return new Uint8Array(clair);
}

// La clef n'est jamais manipulable par le script après son import : extractable = false, usage unique par
// sens. Le générateur cryptographique du navigateur fournit les 16 octets de l'identifiant de la page.
function importeCle(octetsDeClef) {
    return crypto.subtle.importKey("raw", octetsDeClef, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
}

function tireIdentifiantTelephone() {
    const octets = new Uint8Array(TAILLE_IDENTIFIANT);
    crypto.getRandomValues(octets);
    return octetsEnBase64Url(octets);
}
// ————— la session de la page : fragment, transport, appairage (AC-30, AC-31, AC-34) —————

const champEtat = document.getElementById("etat");
const champDetail = document.getElementById("detail");

// SCAN-3 et avenant AV1 §3, AC-1 / AC-15 : les pièces de la prise de vue, prises une fois pour toutes comme
// les deux paragraphes d'état ci-dessus. La section reste cachée tant que la session n'est pas ouverte ; les
// deux champs de sélection ne se montrent jamais, ce sont les deux boutons qui les ouvrent.
const sectionPrise = document.getElementById("prise");
const toile = document.getElementById("toile");
const boutonPrendre = document.getElementById("prendre");
const boutonCharger = document.getElementById("charger");
const champAppareil = document.getElementById("appareil");
const champGalerie = document.getElementById("galerie");
// 1.3b (fiche §2, ligne « Ouverture ») : les trois pièces que la caméra fait vivre — l'aperçu de l'objectif,
// la ligne où se lit chaque mesure, et la commande qui déclenche une prise. Les deux premières étaient cachées
// avec la section ; la commande de prise ne paraît que l'objectif ouvert.
const apercu = document.getElementById("apercu");
const boutonDeclencher = document.getElementById("declencher");
const ligneMesure = document.getElementById("mesure");
// 1.3c (fiche §2, ligne « Compteur ») : la ligne d'à côté, celle des trois chiffres de la session.
const ligneCompteur = document.getElementById("compteur");

// Toute la mémoire de la page. Rien n'y est écrit dans un stockage du navigateur : fermer l'onglet tue la
// clef, l'identifiant et les compteurs (DIR-SCAN-5 v2, AC-28).
const seance = {
    url: "",                         // http://<adresse>:<port>, sans chemin ni fragment
    cle: null,                       // la CryptoKey importée du fragment, non extractible
    identifiant: "",                 // les 16 octets tirés par la page, sur la seule route /apparier
    prochainCompteur: 0n,            // sens téléphone : le dernier compteur ÉMIS (le premier porté sera 1)
    dernierCompteurPc: 0n,           // sens PC : le plus grand compteur déjà ouvert (anti-rejeu, AC-30)
    aparie: false,
    enVol: false,
    arret: false,
    minuteur: null,
    messageDeFin: null,              // le message /fin scellé d'avance, prêt à partir en keepalive
    finEnvoyee: false,
    contexteDeLaPhoto: ""            // AC-15 : « Photo k sur n » pendant une série, vide pour une seule photo
};

// L'état de la page, en deux lignes : la phrase courte et son détail. AC-15 (avenant AV1 §3) ajoute la
// progression de la série : tant qu'une file de photos part, le contexte porte « Photo k sur n » et se rappelle
// à chaque phrase, y compris aux réponses du PC — « la page affiche la progression (photo k sur n) et la
// réponse de chacune ». Hors série, le contexte est vide et la ligne se lit comme sous la v1.
function affiche(texte, classe, detail) {
    champEtat.textContent = texte;
    champEtat.className = "etat" + (classe ? " " + classe : "");

    const reste = detail || "";
    champDetail.textContent = seance.contexteDeLaPhoto === ""
        ? reste
        : (reste === "" ? seance.contexteDeLaPhoto : seance.contexteDeLaPhoto + " — " + reste);
}

// Le compteur du téléphone est unique pour les trois routes — le PC n'en tient qu'un par sens
// (SessionChiffree.AccepteCompteur) — et ne fait que croître : un message refusé au passage laisse donc une
// valeur non utilisée, ce que le PC accepte puisqu'il n'exige que la croissance strictement.
function emetsCompteur() {
    seance.prochainCompteur += 1n;
    return seance.prochainCompteur;
}

// Une requête vers le PC. targetAddressSpace: "local" (AC-34) est ce que Chrome et Brave exigent pour
// qu'une page en https parle à une adresse du réseau privé ; les autres navigateurs l'ignorent.
// credentials: "omit" : aucun cookie, aucun en-tête d'authentification — la clef fait tout (DIR-SCAN-5 v2).
// AC-40 (correctif SCAN-2-AV3-3 §3) : une seule requête change de type de corps, /fin. Le corps
// octet-stream n'est pas un type de corps « simple » : hors de l'origine, le navigateur doit alors envoyer
// un préliminaire OPTIONS avant de pouvoir envoyer le corps. Pour /fin, ce préliminaire doit partir alors
// que l'onglet se ferme — rien ne le fait aboutir, et le message ne part jamais. text/plain est le seul type
// de corps qu'un navigateur envoie sans préliminaire ; le corps reste le même message chiffré, octet pour
// octet (le serveur ne lit aucun Content-Type : il juge la taille, puis les octets), et la route appelante
// est dans les données associées du message, donc un /fin ne se relit pas sur une autre route.</para>
async function envoie(route, message, options) {
    const enTetes = {
        "Content-Type": route === ROUTE_FIN ? TYPE_DE_CORPS_SANS_PRELIMINAIRE : TYPE_DE_CORPS_CHIFFRE
    };
    if (options && options.identifiant)
        enTetes[EN_TETE_IDENTIFIANT] = seance.identifiant;

    return await fetch(seance.url + route, {
        method: "POST",
        mode: "cors",
        credentials: "omit",
        cache: "no-store",
        redirect: "error",
        referrerPolicy: "no-referrer",
        headers: enTetes,
        body: message,
        keepalive: !!(options && options.keepalive),
        targetAddressSpace: "local"
    });
}

// La réponse chiffrée du PC, ouverte. Le compteur doit être STRICTEMENT plus grand que le dernier ouvert —
// une réponse volée sur le réseau ne se relit pas deux fois (AC-30) — et les trous sont tolérés : un
// battement dont la réponse s'est perue laisse un compteur non vu, ce qui n'est pas un rejeu. C'est le seul
// écart assumé à PagesScan.MessagePresse, qui exige la valeur exacte parce qu'un test ne fait qu'un échange.
async function ouvreReponse(route, octets) {
    if (octets.length < TAILLE_COMPTEUR + TAILLE_ETIQUETTE)
        return null;

    const recu = lisCompteur(octets);
    if (recu <= seance.dernierCompteurPc)
        return null;

    let clair;
    try {
        clair = await ouvrir(seance.cle, SENS_PC, route, recu, octets);
    } catch (etiquetteRejetee) {
        return null;
    }

    if (clair === null)
        return null;

    seance.dernierCompteurPc = recu;
    try {
        return new TextDecoder("utf-8", { fatal: true }).decode(clair);
    } catch (texteMalForme) {
        return null;
    }
}

// AC-31 : le premier message porte l'identifiant tiré par la page et lie la clef à cette origine ; après
// lui, /etat et /fin se servent à la seule possession de la clef. Un 401 veut dire que la clef du QR n'est
// plus celle du PC : c'est la phrase d'AC-34, et rien d'autre.
async function apparie() {
    const message = await sceller(
        seance.cle, SENS_TELEPHONE, ROUTE_APPAIRAGE, emetsCompteur(), "{\"v\":1,\"type\":\"apparier\"}");
    const reponse = await envoie(ROUTE_APPAIRAGE, message, { identifiant: true });

    if (reponse.status === 403) {
        // Le PC n'a pas reconnu l'origine de la page (AC-32) : ce n'est pas le code qui a servi, c'est
        // l'adresse depuis laquelle la page est ouverte. La phrase d'AC-34 serait ici une fausse piste.
        affiche(MESSAGE_HORS_ORIGIN, "refus");
        arrete();
        return false;
    }

    if (reponse.status === 401) {
        affiche(MESSAGE_REFUS, "refus");
        arrete();
        return false;
    }

    if (!reponse.ok) {
        affiche(MESSAGE_TRANSPORT, "attente");
        return false;
    }

    const texte = await ouvreReponse(ROUTE_APPAIRAGE, new Uint8Array(await reponse.arrayBuffer()));
    if (texte === null) {
        affiche(MESSAGE_REFUS, "refus");
        arrete();
        return false;
    }

    seance.aparie = true;
    affiche(MESSAGE_CONNECTE, "connecte");   // AC-34, mot pour mot
    return true;
}
// ————— le battement de cinq secondes, l'état rendu par le PC, la fermeture (AC-34, AC-36) —————

// Le message /fin est scellé à l'avance, juste après chaque échange réussi : pagehide ne laisse pas le temps
// d'attendre WebCrypto. Il réserve le compteur suivant, donc reste toujours strictement supérieur au dernier
// message parti (AC-30), et il n'est tiré qu'une fois.
async function prepareMessageDeFin() {
    seance.messageDeFin = await sceller(
        seance.cle, SENS_TELEPHONE, ROUTE_FIN, emetsCompteur(), "{\"v\":1,\"type\":\"fin\"}");
}

function envoieLaFin() {
    if (seance.finEnvoyee || seance.messageDeFin === null)
        return;

    const message = seance.messageDeFin;
    seance.messageDeFin = null;
    seance.finEnvoyee = true;

    // La réponse n'est pas attendue : la page est en train de fermer. keepalive est ce qui laisse le
    // navigateur finir l'envoi après la fermeture (AC-34 : « envoie /fin à sa fermeture, en keepalive »),
    // et le type de corps text/plain (AC-40, correctif SCAN-2-AV3-3) ce qui le lui laisse commencer sans
    // préliminaire : le message part seul, sans attendre une réponse OPTIONS qui n'arriverait plus.
    envoie(ROUTE_FIN, message, { keepalive: true }).catch(function (rejet) {
        // /fin peut ne pas partir : le PC passera de lui-même à « Téléphone inactif » puis « Téléphone
        // déconnecté » (AC-36), et la clef meurt à la fermeture de l'écran du PC (DIR-SCAN-5 v2).
    });
}

// Couper le battement et oublier le message de fin : après un refus, la clef n'est plus la bonne, il n'y a
// plus rien à fermer proprement. Ce que la page tenait de plus depuis l'avenant AV1 §3 — rien du tout côté
// caméra, l'application photo du téléphone ouvrait et refermait son objectif — est devenu faux en 1.3b : la
// page tient un objectif ouvert, et la fiche §2 (ligne « Arrêt ») veut qu'il soit rendu ici même. Un 401 du
// battement (« Nouveau code d'appairage » au PC) ferme la session : la caméra s'éteint avec la clef, le témoin
// vert du téléphone s'éteint aussi (DIR-SCAN-25 c, AC-4).
function arrete() {
    seance.arret = true;
    if (seance.minuteur !== null) {
        clearInterval(seance.minuteur);
        seance.minuteur = null;
    }
    seance.messageDeFin = null;
    coupeLaCamera();
}

// Un battement : /etat, dont la réponse chiffrée porte l'état de la session (AC-34, AC-36).
async function demandeEtat() {
    const message = await sceller(
        seance.cle, SENS_TELEPHONE, ROUTE_ETAT, emetsCompteur(), "{\"v\":1,\"type\":\"etat\"}");
    const reponse = await envoie(ROUTE_ETAT, message, null);

    if (reponse.status === 403) {
        // Origine refusée en cours de route (AC-32) : la clef n'y est pour rien, c'est l'adresse de la page.
        affiche(MESSAGE_HORS_ORIGIN, "refus");
        arrete();
        return false;
    }

    if (reponse.status === 401) {
        // AC-30 : le PC a changé de clef entre deux battements — « Nouveau code d'appairage » a été touché.
        affiche(MESSAGE_REFUS, "refus");
        arrete();
        return false;
    }

    if (!reponse.ok) {
        affiche(MESSAGE_TRANSPORT, "attente");
        return true;
    }

    const texte = await ouvreReponse(ROUTE_ETAT, new Uint8Array(await reponse.arrayBuffer()));
    if (texte === null) {
        affiche(MESSAGE_REFUS, "refus");
        arrete();
        return false;
    }

    let recu = null;
    try {
        recu = JSON.parse(texte);
    } catch (jsonRejete) {
        recu = null;
    }

    const mot = recu !== null && typeof recu.etat === "string" ? recu.etat : "";
    if (mot === "deconnecte") {
        // AC-36 : le PC a reçu un /fin ou compte trente minutes sans message authentifié. La session est
        // close, le battement s'arrête ici — un nouveau QR est le seul chemin qui la rouvre.
        affiche(ETATS.deconnecte, "refus");
        arrete();
        return false;
    }

    const libelle = Object.prototype.hasOwnProperty.call(ETATS, mot) ? ETATS[mot] : ETATS.inconnu;
    affiche(libelle, mot === "connecte" ? "connecte" : (mot === "inactif" ? "attente" : "refus"),
        suiviDesPhotos(recu));
    return true;
}

// SCAN-FIX P3 : ce que le PC dit des photos reçues, quand il reconnaît en arrière-plan — « photos » est une
// liste { id, etat, nom, extension, numero } portée par la réponse chiffrée de /etat. Les mots du protocole
// (en_attente, en_cours, reconnue, a_valider, non_reconnue, erreur) ne se montrent pas : la page compte et dit
// en français. Un PC qui ne rend pas cette liste (reconnaissance dans l'appel) ne change rien à l'écran.
function suiviDesPhotos(recu) {
    if (recu === null || !Array.isArray(recu.photos) || recu.photos.length === 0)
        return undefined;

    let attente = 0, reconnues = 0, aValider = 0, perdues = 0;
    let derniere = "";
    recu.photos.forEach(function (photo) {
        if (photo === null || typeof photo !== "object")
            return;
        if (photo.etat === "en_attente" || photo.etat === "en_cours") {
            attente += 1;
        } else if (photo.etat === "reconnue") {
            reconnues += 1;
            if (typeof photo.nom === "string")
                derniere = photo.nom;
        } else if (photo.etat === "a_valider") {
            aValider += 1;
        } else {
            perdues += 1;
        }
    });

    const morceaux = [];
    if (attente > 0)
        morceaux.push(attente + " en attente");
    if (reconnues > 0)
        morceaux.push(reconnues + " reconnue" + (reconnues > 1 ? "s" : ""));
    if (aValider > 0)
        morceaux.push(aValider + " à valider sur le PC");
    if (perdues > 0)
        morceaux.push(perdues + " à reprendre");
    return morceaux.join(" · ") + (derniere === "" ? "" : " — dernière : " + derniere);
}

// La boucle de l'écran. Un seul échange à la fois : un battement qui traîne sur un réseau encombré passe son
// tour plutôt que de partir en parallèle, ce qui désordonnerait les compteurs. Les tentatives reprennent
// toutes les cinq secondes tant que la page est ouverte, y compris après un appairage manqué — un téléphone
// qui a scanné trop tôt n'a rien à rescanner. (Un onglet caché est mis au ralenti par le navigateur ; le PC
// affiche alors « Téléphone inactif », ce qui est exactement l'état des lieux.)
async function battement() {
    if (seance.enVol || seance.arret)
        return;

    seance.enVol = true;
    try {
        const poursuite = seance.aparie ? await demandeEtat() : await apparie();
        if (poursuite && !seance.arret)
            await prepareMessageDeFin();
    } catch (horsReseau) {
        affiche(MESSAGE_TRANSPORT, "attente");
    } finally {
        seance.enVol = false;
    }
}
// ————— le fragment du QR, la sonde d'interopérabilité, le démarrage (AC-28, AC-30, AC-33, AC-34) —————

const MOTIF_V4 = /^(\d{1,3}\.){3}\d{1,3}$/;
const MOTIF_V6 = /^[0-9A-Fa-f:]+$/;
const MOTIF_PORT = /^\d{1,5}$/;

function refusDeFragment(motif) {
    return { erreur: motif, adresse: "", port: "", octetsDeClef: null };
}

// Le fragment #v=1&a=<adresse>&p=<port>&k=<clef> (avenant §2, OriginesScan.UrlDuQr) : rien d'autre n'y est
// admis, et « v » vaut 1 ou le code ne vient pas de cette version du protocole. La clef relue ici n'est
// écrite ni à l'écran ni au journal (AC-28, DIR-SCAN-21) ; l'adresse et le port, si, mais seulement dans la
// phrase d'erreur, où ils ne figurent pas.
function litFragment() {
    const brut = location.hash.replace(/^#/, "");
    if (brut === "")
        return refusDeFragment("absent");

    const parametres = new URLSearchParams(brut);
    const adresse = parametres.get("a");
    const port = parametres.get("p");
    const clef = parametres.get("k");
    if (parametres.get("v") !== "1" || adresse === null || port === null || clef === null)
        return refusDeFragment("format");

    const octetsDeClef = base64UrlEnOctets(clef);
    if (octetsDeClef === null || octetsDeClef.length !== TAILLE_CLE)
        return refusDeFragment("clef");

    const numero = Number(port);
    const adresseValide = (MOTIF_V4.test(adresse) || MOTIF_V6.test(adresse)) &&
        MOTIF_PORT.test(port) && numero >= 1 && numero <= 65535;
    if (!adresseValide)
        return refusDeFragment("format");

    return { erreur: "", adresse: adresse, port: port, octetsDeClef: octetsDeClef };
}

// AC-34 : « lit le fragment puis l'efface de la barre d'adresse ». Le fragment ne reste donc ni dans
// l'historique, ni dans une capture d'écran ultérieure, et la page ne peut pas le relire par mégarde — un
// second appairage avec la même clef serait de toute façon refusé (AC-30).
function effaceLeFragment() {
    try {
        history.replaceState(null, "", location.pathname + location.search);
    } catch (historiqueRefuse) {
        // Un fichier ouvert en « file:// » refuse parfois replaceState : le fragment reste affiché dans la
        // barre, le fonctionnement de la page n'en est pas changé.
    }
}

// AC-33 : le même vecteur (clef, sens, route, compteur, clair) doit donner les mêmes octets chiffrés dans
// .NET et ici. Ce bloc ne sert qu'à la sonde — Edge sans tête lancé sur « index.html?sonde=1&… » relève
// l'hexadécimal affiché dans le DOM — et ne fait aucune requête : il n'utilise ni le fragment, ni la session,
// ni le réseau. Le vecteur vient des paramètres d'URL (AC-33), donc la page reste ouverte telle quelle après
// l'appairage : rien de ce que la sonde lit ne sort du téléphone. Elle ne révèle aucun secret — la clef qu'elle
// scelle est celle que le test lui donne — et n'ouvre aucune porte : les paramètres ne sont pas utilisés par
// la session, dont le seul point d'entrée reste le fragment du QR (AC-30).
const SONDE = {
    clef: "",
    sens: 0,
    route: ROUTE_ETAT,
    compteur: "",
    clair: ""
};

function remplitSonde(parametres) {
    const clef = parametres.get("k");
    const compteur = parametres.get("c");
    if (clef === null || compteur === null || !/^\d+$/.test(compteur))
        return false;

    const sens = parametres.get("sens");
    const route = parametres.get("route");
    SONDE.clef = clef;
    SONDE.compteur = compteur;
    SONDE.sens = sens === null ? SENS_TELEPHONE : Number(sens);
    SONDE.route = route === null ? ROUTE_ETAT : route;
    SONDE.clair = parametres.get("clair") === null ? "" : parametres.get("clair");
    return SONDE.sens === SENS_TELEPHONE || SONDE.sens === SENS_PC;
}

function estLaSonde() {
    const parametres = new URLSearchParams(location.search);
    return parametres.get("sonde") === "1" ? parametres : null;
}

async function sondeAc33(parametres) {
    if (!remplitSonde(parametres)) {
        document.title = "SONDE AC-33";
        affiche("Sonde AC-33 : vecteur incomplet.", "refus", "Il faut au moins k=<clef base64url> et c=<compteur>.");
        return;
    }

    const octetsDeClef = base64UrlEnOctets(SONDE.clef);
    if (octetsDeClef === null || octetsDeClef.length !== TAILLE_CLE) {
        document.title = "SONDE AC-33";
        affiche("Sonde AC-33 : clef du vecteur invalide.", "refus", "k doit être une clef de 32 octets en base64url.");
        return;
    }

    try {
        const clef = await importeCle(octetsDeClef);
        const compteur = BigInt(SONDE.compteur);
        const valeurDuNonce = nonce(SONDE.sens, compteur);
        const donnees = donneesAssociees(SONDE.sens, SONDE.route, compteur);
        const message = await sceller(clef, SONDE.sens, SONDE.route, compteur, SONDE.clair);

        document.title = "SONDE AC-33";
        affiche(
            "Sonde AC-33",
            "attente",
            "NONCE " + octetsEnHexadecimal(valeurDuNonce) + "\n" +
            "AAD " + new TextDecoder("utf-8").decode(donnees) + "\n" +
            "MESSAGE " + octetsEnHexadecimal(message));
    } catch (echec) {
        document.title = "SONDE AC-33";
        affiche("Sonde AC-33 en échec.", "refus", echec && echec.name ? echec.name : String(echec));
    }
}


// ————— la prise de vue (SCAN-3, fiche §2 « Prise de vue » ; avenant AV1 §3, AC-1, AC-15, AC-16) —————
//
// Ce qui distingue la v2 de la v1 tient en trois phrases, écrites par l'avenant AV1 : le téléphone prend la
// photo avec son propre appareil photo, ou la choisit dans sa galerie plusieurs à la fois ; chaque image est
// réencodée en JPEG à partir de l'original qu'il vient de rendre ; et elle part à la route chiffrée /photo,
// dont la réponse dit ce que le PC a reconnu. Les règles de la v1 restent telles quelles : fragment lu puis
// effacé, clef non extractible et jamais écrite dans un stockage du navigateur, un seul échange à la fois
// (seance.enVol), aucune ressource externe, aucun corps texte lisible.
//
// Ce que l'avenant AV1 §3 (ligne 45) avait retiré — l'aperçu en direct, l'API de flux, la capture de la trame —
// et pourquoi, écrit au constat §1 du même avenant : la page demandait la caméra sans résolution et capturait
// la trame à la taille du flux, donc envoyait une image trop petite pour lire la ligne du bas. Douze photos
// prises par l'aperçu n'ont rendu aucune « Exacte » ; une photo prise par l'appareil photo du téléphone a fait
// lire l'édition et le numéro pour la première fois. 1.3b rend l'aperçu à la page, pas ce défaut : la commande
// d'ouverture demande la taille de prise à l'objectif lui-même (fiche §2, ligne « Taille »), et jamais ce qui
// est dessiné à l'écran ne devient la photo — c'est un des interdits de la fiche §2 (ligne « Interdits »), et
// le test de la page le relit.
//
// Ce que ce bloc ne prouve pas : qu'un téléphone ouvre bien l'objectif du dos sur « Prendre une photo », qu'il
// ouvre la galerie avec plusieurs images sur « Charger des photos », et la hauteur réelle que le navigateur
// laisse à l'écran en portrait. AC-1, AC-15 et AC-16 sont au R-RUN (avenant §4 point 5), pas à un test
// unitaire — A1-17 : le test de la page est un test de câblage.

const COTE_ENVOYE = 4032;        // fiche §2, ligne « Réencodage » : « La page réencode en JPEG, grand côté
                                 // ≤ 4 032 px (DIR-SCAN-7), puis chiffre selon le protocole AV3 (…) et envoie
                                 // sur une nouvelle route POST /photo. » AC-16 de l'avenant reprend le même
                                 // plafond et y ajoute la provenance : « à partir de l'image d'origine du
                                 // téléphone, jamais d'une image plus petite ». Le facteur ne fait donc que
                                 // réduire — une image déjà sous le plafond part à sa taille. Le PC, lui, juge
                                 // les dimensions dans l'en-tête (ContrôlePhoto, refus au-delà de 8 000 × 8 000).
const QUALITE_JPEG = 0.85;       // choix du DEV, pas une citation de la fiche : la fiche §2 dit « réencode en
                                 // JPEG » et ne nomme aucun taux. 0,85 vise un fichier qui reste sous les 15 Mo
                                 // du message chiffré sans jeter de détail sur la carte ; ce qu'un téléphone
                                 // donné rend vraiment se juge au R-RUN (fiche §7).

// AC-15 : « Les photos choisies partent une par une, chacune après la réponse de la précédente. » Ce que la
// série tient en mémoire : les fichiers restants, et les deux chiffres qu'elle affiche. Rien n'y survit à la
// page (DIR-SCAN-5 v2), et un seul tour de file à la fois (AC-6 côté PC). La raison d'un arrêt, elle, ne tient
// pas ici : c'est la boucle qui la connaît, et elle s'éteint avec elle.
const serie = {
    fichiers: [],                  // la file des fichiers restants, dans l'ordre du téléphone
    total: 0,                      // le n de « photo k sur n », figé au premier tour
    envoyees: 0,                   // le k de « photo k sur n »
    enCours: false                 // une série occupe-t-elle la session ?
};

// 1.3b (fiche §2, lignes « Ouverture », « Un appui, une photo » et « File d'envoi ») : toute la mémoire de la
// caméra de la page. Comme la série de la galerie, elle ne tient qu'en mémoire de script — rien n'en survit à
// la page (DIR-SCAN-5 v2) et rien ne s'écrit sur le téléphone (DIR-SCAN-8, liste de DIR-SCAN-26) : une photo
// n'existe que dans `file` jusqu'à son envoi.
const camera = {
    flux: null,                    // l'objectif ouvert, null quand il ne vit pas
    capteur: null,                 // ce qui le déclenche, null avec lui
    file: [],                      // les photos rendues par les appuis, dans leur ordre
    enCours: false,                // une file de la caméra occupe-t-elle la session ?
    numero: 0,                     // le n de « Photo n : … » rendu sur la ligne de mesure
    attente: null,                 // la prise en cours : le prochain appui se range derrière elle
    refus: ""                      // le dernier refus lu, non vide dès qu'il faut rendre l'appareil natif
};

// 1.3c (fiche §2, ligne « Compteur », D-7) : les trois chiffres que le doigt lit sous la ligne de mesure. Comme la
// file et la série, ils ne tiennent qu'en mémoire de script — rien n'en survit à la page (DIR-SCAN-5 v2, la liste de
// DIR-SCAN-26). Rien n'y est jamais remis à zéro : une session close laisse les photos restantes en « attente » (D-8).
const compteur = {
    prises: 0,                     // chaque photo rendue par un appui, chaque photo choisie dans la galerie
    recues: 0,                     // chaque réponse du PC qui n'est pas un refus
    refusees: 0                    // 413, refus définitif, réponse illisible, photo que le téléphone n'a pas lue
};

// Le seul écrivain de la ligne du compteur (fiche §2, ligne « Compteur ») : « Prises : P · Reçues : R · En attente : A »,
// suivi de « · Refusées : X » seulement quand X dépasse zéro (décision de Thomas du 2026-11-17). A n'est pas un
// quatrième chiffre mais ce qui reste des prises — les photos de la file, et celles qu'une session close laisse
// derrière elles (D-8). La ligne paraît à la première prise et ne se cache plus : un compte revenu à zéro se lit.
function afficheLeCompteur() {
    ligneCompteur.textContent = "Prises : " + compteur.prises
        + " · Reçues : " + compteur.recues
        + " · En attente : " + (compteur.prises - compteur.recues - compteur.refusees)
        + (compteur.refusees > 0 ? " · Refusées : " + compteur.refusees : "");
    ligneCompteur.hidden = compteur.prises === 0;
}

// Ce qu'un envoi rend à la file qui le porte (1.3c, fiche §2, ligne « Trois issues ») : trois issues, pas deux.
// APRES_CONTINUE — la photo est partie, ou écartée d'autorité pour sa forme ou sa taille : la suivante mérite sa
// chance. APRES_REPRISE — la photo n'est pas arrivée et le PC ne lui reproche rien (transport manqué, réponse non
// 2xx, refus passager) : elle repart seule, cinq secondes plus tard, avec les mêmes octets en main. APRES_ARRET —
// la session est close, il n'y a plus de clef pour chiffrer : la file s'arrête et dit son compte.
const APRES_CONTINUE = "continue";
const APRES_REPRISE = "reprise";
const APRES_ARRET = "arret";

// Un champ de sélection rendu vide. Sans ce geste, retoucher le bouton sur la même photo ne rendrait aucun
// événement change — la valeur n'aurait pas bougé — et la photo ne partirait pas deux fois par inadvertance.
function videLeChamp(champ) {
    champ.value = "";
}

// Une seule file à la fois (AC-15, et AC-6 côté PC qui ne laisse qu'une photo en cours d'examen).
function serieEnCours() {
    if (!serie.enCours)
        return false;

    affiche(MESSAGE_SERIE_EN_COURS, "attente", "Attends la réponse de la dernière, puis retouche le bouton.");
    return true;
}

// AC-1, premier chemin : « “Prendre une photo” (ouvre l'appareil photo arrière) ». La page ne se montre rien
// elle-même : c'est l'application photo du téléphone qui cadre, qui déclenche, et qui rend sa photo en pleine
// résolution — l'attribut capture="environment" du champ #appareil est ce qui demande l'objectif du dos. Le
// clic synthétique se tient dans le geste du doigt qui l'a demandé : hors d'un geste de l'utilisateur, aucun
// navigateur n'ouvre ce sélecteur-là. Une prise annulée ne rend aucun événement change : rien ne part (AC-1).
function ouvreLeSelecteurDePrise() {
    if (serieEnCours())
        return;
    champAppareil.click();
}

// AC-15 : « “Charger des photos” ouvre la galerie avec sélection multiple. » Le champ #galerie ne porte aucun
// capture et porte multiple : c'est ce qui laisse le téléphone montrer sa galerie et en choisir plusieurs.
function ouvreLaGalerie() {
    if (serieEnCours())
        return;
    champGalerie.click();
}

// ————— 1.3b (fiche §2) : la caméra ouverte dans la page, sur l'appui du doigt —————
//
// Ce que ce bloc ajoute, et ce qu'il laisse tel quel : l'objectif s'ouvre dans la page et y rend ses photos
// sans écran de validation, la caméra restant ouverte entre deux cartes. Ce qui part au PC ne change pas d'un
// octet — chaque photo est réencodée par le chemin déjà payé avant de partir (DIR-SCAN-27), puis chiffrée sur
// la route /photo avec les mêmes compteurs et les mêmes phrases.
//
// L'ordre d'armement est celui de la fiche §2, ligne « Ouverture », qui est aussi celui de DIR-SCAN-24 b : rien
// n'est demandé au chargement de la page, l'objectif ne s'ouvre que sur l'appui, et le micro n'est jamais
// demandé. La fiche §2, ligne « Interdits », défend la trame du flux comme origine de la photo : la taille de
// prise se lit à la place sur les capacités de l'objectif (fiche §2, ligne « Taille »).
//
// Ce que ce bloc ne prouve pas : qu'un téléphone ouvre l'objectif du dos sur « Prendre une photo », que la photo
// rendue mesure 4 032 px de grand côté, que dix appuis d'une série tiennent sous la seconde, que l'objectif
// s'éteigne quand la page se cache, et ce que dit Brave quand la caméra est refusée. AC-1, AC-2, AC-3, AC-4,
// AC-5 et AC-7 sont au R-RUN de Thomas (fiche §6) ; les tests de la page ne relisent que son texte.

// La commande « Prendre une photo ». C'est d'elle, et d'elle seule, que la caméra est demandée (DIR-SCAN-24 b) :
// aucun appel d'ouverture ne part au chargement de la page, et rien d'autre ne la déclenche. Le premier chemin
// ouvre l'objectif dans la page ; après un refus, la fiche §2 (ligne « Repli ») veut que le même appui rende
// l'appareil natif du téléphone — la chaîne d'avant, inchangée.
function surPrendre() {
    if (serieEnCours())
        return;

    if (camera.refus !== "") {
        ouvreLeSelecteurDePrise();
        return;
    }

    ouvreLaCamera().catch(function (refus) {
        camera.refus = (refus && refus.name ? refus.name : "camera") +
            (refus && refus.message ? " — " + refus.message : "");
        affiche(MESSAGE_CAMERA_REFUSEE, "refus", camera.refus);
    });
}

// L'objectif du dos, et lui seul : « audio: false » (le micro n'est jamais demandé, DIR-SCAN-24 a) et
// « facingMode » en idéal « environment » (fiche §2, ligne « Ouverture »). Une seule fois dans la page, et
// jamais au chargement. Le refus n'est pas attrapé ici : c'est la commande qui l'écrit avec le nom de l'erreur,
// et qui rend l'appareil natif au second appui.
async function ouvreLaCamera() {
    const flux = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: "environment" } }
    });

    // Le flux est tenu dès qu'il est obtenu : tout ce qui suit peut encore refuser, et ce qui a été ouvert doit
    // être rendu — sinon l'objectif resterait vif sous une page qui ne le montre plus (DIR-SCAN-25). Un
    // navigateur sans capteur de prise ne rendrait pas la photo demandée : l'objectif repart ici, et le repli
    // natif répondra au second appui (fiche §2, ligne « Repli »).
    camera.flux = flux;
    let piste = null;
    try {
        if (typeof ImageCapture !== "function")
            throw new Error("ImageCapture absent de ce navigateur");

        piste = flux.getVideoTracks()[0];
        camera.capteur = new ImageCapture(piste);
        apercu.srcObject = flux;    // le flux arrive par la source d'objet : rien à charger, aucune URL d'objet
    } catch (capteurManquant) {
        coupeLaCamera();
        throw capteurManquant;
    }

    try {
        await apercu.play();
    } catch (apercuRefuse) {
        // L'aperçu peut refuser de lire. Il ne doit pas pour autant jeter la prise : l'objectif est ouvert et la
        // commande « Photo » répond — ce que l'écran montre n'entre pas dans la photo.
    }

    camera.refus = "";
    camera.numero = 0;
    ligneMesure.textContent = "";
    apercu.hidden = false;
    boutonDeclencher.hidden = false;
    boutonDeclencher.disabled = serie.enCours;   // une série de la galerie tient la session : « Photo » attend
    boutonPrendre.hidden = true;                 // la caméra vit : la commande qui l'ouvre ne se montre plus

    const annonce = piste && piste.label ? piste.label : "objectif ouvert";
    affiche(MESSAGE_CAMERA_OUVERTE, "connecte", annonce);
}

// Chaque appui sur « Photo » rend une photo, et un appui qui arrive pendant une prise attend son tour (fiche §2,
// ligne « Un appui, une photo »). Le temps se compte dès l'appui, avant l'attente du tour : c'est le chiffre que
// le R-RUN compare aux 1 000 ms d'AC-3, attente derrière la prise précédente comprise.
function auDeclencheur() {
    const appui = performance.now();
    camera.numero += 1;

    const numero = camera.numero;
    const suite = function () {
        return rendsLaPhoto(appui, numero);
    };
    const chaine = camera.attente === null ? Promise.resolve() : camera.attente;
    camera.attente = chaine.then(suite, suite);
}

// Une prise, mesurée puis rangée dans la file d'envoi. Ce que la caméra n'a pas rendu se dit, et la carte
// d'après mérite sa chance, comme dans la série de la galerie.
async function rendsLaPhoto(appui, numero) {
    if (camera.capteur === null)
        return;         // l'objectif a été rendu pendant l'attente : cet appui n'a plus rien à prendre

    const photo = await prendsLaPhoto();
    const rendu = Math.round(performance.now() - appui);
    if (photo === null)
        return;         // la prise a déjà dit ce qui n'a pas marché

    const grandeur = await grandeurDeLaPhoto(photo);
    ligneMesure.textContent = "Photo " + numero + " : " + grandeur + " px, " + rendu + " ms";
    rangeLaPhoto(photo);
}

// La prise réglée à la plus grande taille que l'objectif annonce (fiche §2, ligne « Taille » — l'écart 🟠 du
// gate 1.3a). Les deux chiffres se lisent dans les capacités du capteur et se passent tels quels à la prise.
// Si la lecture des capacités ou la prise réglée échoue, la prise part au défaut du navigateur — 3024 × 4032
// mesurés en 1.3a — et la ligne de mesure rend ce qu'elle a reçu, pas ce qui avait été demandé.
async function prendsLaPhoto() {
    const capteur = camera.capteur;
    if (capteur === null)
        return null;

    try {
        const capacites = await capteur.getPhotoCapabilities();
        return await capteur.takePhoto({
            imageWidth: capacites.imageWidth.max,
            imageHeight: capacites.imageHeight.max
        });
    } catch (priseRegleeImpossible) {
        try {
            return await capteur.takePhoto();
        } catch (priseImpossible) {
            // Ni réglée ni au défaut : la photo n'a jamais existé, et le PC n'y est pour rien. Le nom de l'erreur
            // se lit, comme ailleurs, pour que le R-RUN sache quoi reprocher à qui.
            affiche(MESSAGE_ENCODE_IMPOSSIBLE, "refus",
                priseImpossible && priseImpossible.name ? priseImpossible.name : "");
            return null;
        }
    }
}

// La grandeur de la photo rendue, lue sur la photo elle-même : la ligne de mesure doit dire ce qui part, pas ce
// qui a été demandé. Cette image ne sert qu'à cette ligne et rend sa mémoire aussitôt — c'est la photo décodée,
// jamais ce que l'aperçu affiche (fiche §2, ligne « Interdits »).
async function grandeurDeLaPhoto(photo) {
    let image = null;
    try {
        image = await createImageBitmap(photo);
        return image.width + " × " + image.height;
    } catch (photoIllisible) {
        return "grandeur illisible";
    } finally {
        if (image !== null)
            image.close();     // une image de 4 032 px pèse sa place, et dix appuis peuvent suivre
    }
}

// La file d'envoi de la caméra (fiche §2, ligne « File d'envoi ») : la photo rendue attend son tour en mémoire,
// et « Charger des photos » se ferme tant qu'il en reste une. Deux files en parallèle se marcheraient sur le
// compteur unique de la session (AC-30) comme sur le seul tour de file du PC (AC-6).
function rangeLaPhoto(photo) {
    camera.file.push(photo);
    // 1.3c (fiche §2, ligne « Compteur ») : la prise est comptée au rang où elle est rangée — le doigt lit « Prises »
    // dès son appui, avant même que la file la rende.
    compteur.prises += 1;
    afficheLeCompteur();
    boutonCharger.disabled = true;

    if (camera.enCours)
        return;         // la boucle tourne déjà : ce rang sera pris au tour suivant

    camera.enCours = true;
    videLaFileDeLaCamera().catch(function (fileSansReponse) {
        affiche(MESSAGE_TRANSPORT, "attente");
    });
}

// La boucle de la file : une photo à la fois ; le Blob rendu par l'objectif est réencodé avant de partir, jamais
// envoyé tel quel (DIR-SCAN-27) ; et un envoi qui échoue reprend seul avec les mêmes octets — c'est
// envoieJusquAuBout qui attend, non cette boucle (1.3c, fiche §2, lignes « Reprise » et « Deux files »). Elle ne
// s'arrête que sur une session close — rendue par APRES_ARRET avec seance.arret vrai — et dit alors le compte
// restant avec la phrase de la série, la photo en cours comprise. À un appui par seconde, la caméra atteint les
// soixante envois par minute du PC : ce refus n'est plus une fin de file, c'est un refus passager du PC.
async function videLaFileDeLaCamera() {
    let arretSurLaSession = false;

    try {
        while (camera.file.length > 0) {
            const photo = camera.file.shift();
            const octets = await jpegDuFichier(photo);

            if (octets === null) {
                leTelephoneNaPasLu();
                // 1.3c (fiche §2, ligne « Compteur ») : une photo que le téléphone ne sait pas lire n'ira jamais au
                // PC. Elle est refusée, pas en attente — « En attente » ne doit rien promettre de lui.
                compteur.refusees += 1;
                afficheLeCompteur();
                if (seance.arret) {
                    arretSurLaSession = true;
                    break;
                }
                continue;
            }

            if (await envoieJusquAuBout(octets) === APRES_ARRET) {
                // Le compte que le finally rend au doigt comprend la photo en cours (fiche §2, ligne
                // « Deux files ») : elle revient en tête de la file avant qu'il le lise.
                camera.file.unshift(photo);
                arretSurLaSession = true;
                break;
            }
        }
    } finally {
        camera.enCours = false;

        const reste = camera.file.length;
        if (arretSurLaSession || seance.arret) {
            camera.file = [];
            if (reste > 0)
                finDeLaSerie(reste, arretSurLaSession);
        }

        rendLesCommandesDeLaCamera();
    }
}

// La relecture de « le PC reçoit-il quelque chose en ce moment ? » toutes les cent millisecondes, posée sur une
// temporisation à fonction : la boucle attend son tour, elle ne jette pas la photo (fiche §2, lignes « File
// d'envoi » et « Reprise »).
function attendsUnCentieme() {
    return new Promise(function (reprise) {
        setTimeout(function () {
            reprise();
        }, 100);
    });
}

// L'attente entre deux essais d'un même envoi (1.3c, décision de Thomas du 2026-11-17 : cinq secondes, sans
// limite) : cinq secondes posées sur une temporisation à fonction, comme la relecture de « seance.enVol »
// ci-dessus. La boucle attend son tour, elle ne rappelle pas elle-même la file et ne jette aucune photo ; la file
// de la caméra reste entière pendant ce temps, et « Charger des photos » reste fermé.
function attendsCinqSecondes() {
    return new Promise(function (reprise) {
        setTimeout(function () {
            reprise();
        }, 5000);
    });
}

// Les commandes rendues au doigt : « Charger des photos » ne se rouvre que si la série de la galerie et la file
// de la caméra sont vides toutes deux (fiche §2, ligne « File d'envoi », l'exclusion), et jamais sur une session
// close — il n'y a plus rien à envoyer.
function rendLesCommandesDeLaCamera() {
    if (seance.arret || serie.enCours || camera.enCours || camera.file.length > 0)
        return;

    boutonCharger.disabled = false;
    boutonPrendre.disabled = false;
}

// L'objectif rendu (fiche §2, ligne « Arrêt » ; DIR-SCAN-25) : chaque piste arrêtée une à une, l'aperçu vidé, la
// commande de prise cachée avec lui et la commande d'ouverture rendue au doigt. Appelée quand la page devient
// cachée, quand elle part, et quand la session se ferme. Rien d'autre n'est coupé : le micro n'a jamais été
// demandé, et la file d'envoi n'a rien à voir avec l'objectif — elle sera reprise ou dite au compte restant.
function coupeLaCamera() {
    if (camera.flux !== null) {
        for (const piste of camera.flux.getTracks())
            piste.stop();
    }

    camera.flux = null;
    camera.capteur = null;
    camera.attente = null;
    apercu.srcObject = null;
    apercu.hidden = true;
    boutonDeclencher.hidden = true;
    boutonDeclencher.disabled = serie.enCours;
    boutonPrendre.hidden = false;
}

// Le gestionnaire de « visibilitychange » : la page cachée — touche d'accueil, écran éteint — rend l'objectif,
// et le retour trouve un aperçu vide sous « Prendre une photo » ; un appui rouvre (fiche §2, ligne « Arrêt » ;
// DIR-SCAN-25 a, AC-4). Revenue à vue, la page ne rouvre rien d'elle-même : la caméra ne se demande que sur
// l'appui (DIR-SCAN-24 b).
function surVisibilite() {
    if (document.visibilityState !== "hidden")
        return;

    coupeLaCamera();
}

// Le gestionnaire de « pagehide » : /fin tente de partir, puis l'objectif est rendu — « pagehide » couvre
// l'envoi de /fin (fiche §2, ligne « Arrêt » ; DIR-SCAN-25 b). Sans lui, l'onglet fermé laisserait l'objectif
// vif jusqu'à ce que le navigateur s'en souvienne.
function surDepart() {
    envoieLaFin();
    coupeLaCamera();
}

// ————— AC-16 (avenant AV1 §3) : le réencodage part de l'image d'origine du téléphone —————
//
// « Chaque photo, prise ou chargée, est réencodée en JPEG à grand côté ≤ 4 032 px à partir de l'image d'origine
// du téléphone, jamais d'une image plus petite. » createImageBitmap lit le fichier que le téléphone vient de
// rendre : c'est le seul chemin par lequel la pleine résolution de l'objectif arrive au PC — la trame d'un
// aperçu, elle, arrivait à la taille du flux, et c'est le constat §1 de l'avenant. Le facteur ne fait que
// réduire (Math.min(1, …)) : une image déjà sous le plafond part à sa taille, l'agrandir n'ajouterait aucun
// détail de carte. Aucune URL d'objet n'est créée — la bitmap vient du fichier, il n'y a aucun chargement que
// la politique « img-src 'none' » aurait à regarder, et rien n'écrit sur le téléphone (DIR-SCAN-8).
async function jpegDuFichier(fichier) {
    let image = null;
    try {
        image = await createImageBitmap(fichier, { imageOrientation: "from-image" });

        const largeur = image.width;
        const hauteur = image.height;
        if (largeur === 0 || hauteur === 0)
            return null;

        const facteur = Math.min(1, COTE_ENVOYE / Math.max(largeur, hauteur));
        const cible = Math.max(1, Math.round(largeur * facteur));
        const cibleHauteur = Math.max(1, Math.round(hauteur * facteur));

        toile.width = cible;
        toile.height = cibleHauteur;
        toile.getContext("2d").drawImage(image, 0, 0, cible, cibleHauteur);

        return await octetsDeLaToile();
    } catch (imageIllisible) {
        // Le téléphone rend un format que son propre décodeur ne sait pas lire ici, ou la mémoire a été
        // refusée : la photo ne part pas, et ce n'est pas un refus du PC. Le nom de l'exception ne se montre
        // pas — il ne dit à personne quoi faire (fiche §2, ligne « Réponse au téléphone »).
        return null;
    } finally {
        if (image !== null)
            image.close();     // une bitmap de 4 032 px pèse sa place ; la série peut en rendre dix
    }
}

// Le JPEG de la toile, en octets. toBlob est asynchrone et ne rend rien : cette promesse est le seul moyen
// d'attendre l'encodage avant de tirer le compteur — deux messages en porte-à-faux se marcheraient sur le
// compteur unique que le PC tient par sens (AC-30). toBlob rend null quand il n'a rien à rendre (toile vide,
// mémoire refusée) ; l'appelante traite ce null comme une image illisible.
function octetsDeLaToile() {
    return new Promise(function (resolve) {
        toile.toBlob(async function (image) {
            resolve(image === null ? null : new Uint8Array(await image.arrayBuffer()));
        }, "image/jpeg", QUALITE_JPEG);
    });
}

// Le téléphone n'a pas rendu une image que son propre décodeur sait lire : la photo n'est jamais partie, et le
// PC n'y est pour rien. La série, elle, passe à la suivante.
function leTelephoneNaPasLu() {
    affiche(MESSAGE_ENCODE_IMPOSSIBLE, "refus", "Choisis un JPEG ou un PNG, ou reprends la carte en photo.");
}

// « la page affiche la progression (photo k sur n) » (AC-15). Une photo seule — la prise d'un coup par
// l'appareil photo, ou un seul choix dans la galerie — n'a rien à compter : le contexte reste vide et la ligne
// d'état se lit comme sous la v1.
function progressionDeLaPhoto() {
    return serie.total > 1 ? "Photo " + serie.envoyees + " sur " + serie.total : "";
}

// Les fichiers que le téléphone a rendus, en tableau bien à nous : la liste vivante du champ se vide derrière
// nous (ci-dessous), et un objet de DOM ne se garde pas entre deux gestes.
function enAttente(champ) {
    return (champ.files && champ.files.length) ? Array.prototype.slice.call(champ.files) : [];
}

// AC-1, premier chemin, la suite du geste : la prise validée par l'application photo est rangée dans la file de
// la caméra (1.3c, fiche §2, ligne « Appareil natif »). C'est là qu'elle est réencodée depuis l'original rendu
// par le téléphone (AC-16, DIR-SCAN-27), qu'elle part au tour, et qu'elle reprend seule si l'envoi échoue — plus
// d'envoi au feu unique qui rendait « continuer » sur un transport manqué. Une prise annulée ne rend aucun
// événement change : cette fonction n'est pas appelée, et rien ne part.
function unePhotoDuTelephone(fichier) {
    rangeLaPhoto(fichier);
}

// AC-15 : « Les photos choisies partent une par une, chacune après la réponse de la précédente. » Toute la file
// se prend avant le premier envoi — le « sur n » affiché ne bouge donc pas en route — et le champ se vide tout
// de suite : ce sont ces objets que la série tient, plus la valeur du téléphone. La boucle est séquentielle :
// un seul envoi à la fois (seance.enVol), un seul compteur par sens (AC-30), un seul tour de file côté PC (AC-6).
async function chargeLaGalerie(fichiers) {
    const choisis = fichiers.slice();
    if (choisis.length === 0)
        return;

    // 1.3b (fiche §2, ligne « File d'envoi », l'exclusion) : une file de la caméra tient la session, et une
    // seconde file démarrerait deux envois en parallèle sur le compteur unique de la session (AC-30) comme sur
    // le seul tour de file du PC (AC-6). La galerie reprendra au doigt, comme sous la v1 pour une série.
    if (camera.enCours || camera.file.length > 0) {
        affiche(MESSAGE_SERIE_EN_COURS, "attente", "Une photo prise dans la page est encore en envoi.");
        return;
    }

    // 1.3c (fiche §2, ligne « Compteur ») : la série compte ses n photos dès qu'elles sont choisies, avant le premier
    // envoi — « En attente » les dit toutes, y compris derrière un envoi qui reprend.
    compteur.prises += choisis.length;
    afficheLeCompteur();

    serie.fichiers = choisis;
    serie.total = choisis.length;
    serie.envoyees = 0;
    await videLaSerie();
}

// AC-15, fin du chemin : « la page ... dit combien de photos restent à renvoyer », et le compte comprend la photo
// en cours (1.3c, fiche §2, ligne « Deux files »). Elle ne le dit plus que sur une session close — un nouveau code
// d'appairage est alors le seul geste. Un refus « minute » ne l'interrompt plus : la reprise des envois la reprend
// seule, les mêmes octets en main.
function finDeLaSerie(reste, sessionClosee) {
    if (!sessionClosee)
        return;     // plus rien ne coupe une file hors session close : il n'y a donc rien d'autre à rendre

    affiche(MESSAGE_SERIE_COUPEE + reste, "refus");
}

// La boucle de la série. Elle s'arrête sur tout ce qui ferme la session ; ailleurs elle passe à la suivante, y
// compris quand le PC n'a pas reconnu la carte ou n'a pas pu la lire — les cartes d'après méritent leur chance.
// Un envoi qui échoue reprend seul, avec les mêmes octets (1.3c, fiche §2, lignes « Reprise » et « Deux files ») :
// une coupure du réseau n'interrompt plus le cours d'une série. Ce qu'elle ne fait pas : envoyer deux photos dans
// le même tour de file (AC-6).
async function videLaSerie() {
    serie.enCours = true;
    boutonCharger.disabled = true;
    boutonPrendre.disabled = true;
    boutonDeclencher.disabled = true;   // 1.3b, fiche §2 ligne « File d'envoi » : la série tient l'objectif

    let arretSurLaSession = false;
    while (serie.fichiers.length > 0) {
        const fichier = serie.fichiers.shift();
        serie.envoyees += 1;
        seance.contexteDeLaPhoto = progressionDeLaPhoto();

        const octets = await jpegDuFichier(fichier);
        if (octets === null) {
            leTelephoneNaPasLu();
            // 1.3c (fiche §2, ligne « Compteur ») : pareillement pour la série — la photo est comptée en refusées et
            // la boucle passe à la suivante.
            compteur.refusees += 1;
            afficheLeCompteur();
            if (seance.arret) {
                arretSurLaSession = true;
                break;
            }
            continue;
        }

        if (await envoieJusquAuBout(octets) === APRES_ARRET) {
            // Le compte rendu en fin de série comprend la photo en cours (fiche §2, ligne « Deux files ») : elle
            // revient en tête de la file avant qu'il le lise.
            serie.fichiers.unshift(fichier);
            arretSurLaSession = true;
            break;
        }
    }

    const reste = serie.fichiers.length;
    serie.fichiers = [];
    serie.envoyees = 0;
    serie.total = 0;
    serie.enCours = false;
    seance.contexteDeLaPhoto = "";
    if (!seance.arret) {
        boutonCharger.disabled = false;
        boutonPrendre.disabled = false;
        boutonDeclencher.disabled = false;    // 1.3b : la série rend la commande de prise, comme elle rend les deux autres
    }

    if (reste > 0)
        finDeLaSerie(reste, arretSurLaSession);
}

// L'envoi d'une photo jusqu'au bout (1.3c, fiche §2, ligne « Reprise ») : la seule fonction qui appelle
// envoieLaPhoto. Elle attend que le tour se libère, envoie, et tant que l'envoi rend APRES_REPRISE elle attend
// cinq secondes et renvoie les MÊMES octets — jamais elle ne relit le fichier ni ne réencode (D-6 : un second
// réencodage rendrait une image différente, et le PC écarte déjà un renvoi par son empreinte, D-5). Elle rend ce
// que l'envoi rend, donc APRES_CONTINUE ou APRES_ARRET seulement.
async function envoieJusquAuBout(octets) {
    for (;;) {
        while (seance.enVol && !seance.arret)
            await attendsUnCentieme();

        const rendu = await envoieLaPhoto(octets);
        if (rendu !== APRES_REPRISE)
            return rendu;

        await attendsCinqSecondes();
    }
}

// Une photo au PC : scellée pour /photo, un seul échange à la fois. Le verrou est celui du battement
// (seance.enVol), et le PC en tient la raison : un seul compteur par sens (AC-30), et AC-6 ne laisse qu'une
// photo en cours. Un battement qui survient pendant l'envoi passe son tour, comme sous la v1.
//
// AC-15, puis 1.3c (fiche §2, ligne « Trois issues »), ce que la fonction REND à envoieJusquAuBout :
// APRES_REPRISE quand la photo n'est pas arrivée et que le PC ne lui reproche rien — transport manqué, réponse
// non 2xx hors 401, 403 et 413, refus passager du PC, ou tour déjà occupé ; APRES_CONTINUE quand elle est partie
// ou écartée d'autorité (413 jugé sur la taille, refus de sa forme, réponse illisible) ; APRES_ARRET quand la
// session vient de se fermer, faute de clef valide ou d'origine admise. Le rendu de renduDeLaPhoto passe tel
// quel, APRES_REPRISE compris.
